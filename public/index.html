<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PDF RAG Assistant</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="workspace">
        <aside class="sidebar">
          <div class="brand-block">
            <div class="brand-mark">R</div>
            <div>
              <p class="eyebrow">PDF RAG</p>
              <h1>Ask your PDF</h1>
            </div>
          </div>

          <form id="uploadForm" class="upload-box">
            <label for="pdfInput">Upload PDF</label>
            <input id="pdfInput" name="pdf" type="file" accept="application/pdf" required />
            <button type="submit">Index PDF</button>
          </form>

          <div class="meta">
            <span>Status</span>
            <strong id="statusText">Waiting for PDF</strong>
          </div>

          <div class="meta">
            <span>Document</span>
            <strong id="documentText">None selected</strong>
          </div>
        </aside>

        <section class="chat-panel">
          <header class="chat-header">
            <div>
              <p class="eyebrow">Document Chat</p>
              <h2>Grounded answers from your uploaded file</h2>
            </div>
            <div class="live-dot" title="Local server"></div>
          </header>

          <div id="messages" class="messages">
            <div class="message assistant">
              Upload a PDF, wait for indexing, then ask questions from that PDF.
            </div>
          </div>

          <form id="askForm" class="ask-bar">
            <input
              id="questionInput"
              type="text"
              placeholder="Ask something from the uploaded PDF..."
              autocomplete="off"
              required
            />
            <button type="submit">Ask</button>
          </form>
        </section>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
